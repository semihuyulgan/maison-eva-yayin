name: Instagram yayini

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Git kimligi
        run: |
          git config user.name "maison-eva-yayin"
          git config user.email "maison-eva-yayin@users.noreply.github.com"
      - name: Zamani geleni yayimla
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MEDYA_TABAN: https://raw.githubusercontent.com/${{ github.repository }}/main
          VIDEO_TABAN: https://semihuyulgan.github.io/maison-eva-yayin
        run: python3 yayinci.py
